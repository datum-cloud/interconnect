name: CI

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  consumer-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/consumer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ui/consumer/.nvmrc
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
